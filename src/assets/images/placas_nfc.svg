<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <!-- Background subtle ambient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#edf2f7" />
    </radialGradient>

    <!-- Acrylic Gloss Sheen -->
    <linearGradient id="acrylicSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.03" />
      <stop offset="70%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08" />
    </linearGradient>

    <!-- Clear Transparent Acrylic Bevel Edge -->
    <linearGradient id="clearEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#e2e8f0" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#94a3b8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.9" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="15" dy="25" stdDeviation="20" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <filter id="baseShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="25" dy="30" stdDeviation="18" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Pure Studio White Canvas -->
  <rect width="800" height="1000" fill="url(#bgGlow)" />

  <!-- Ground Contact Shadow -->
  <ellipse cx="440" cy="800" rx="310" ry="55" fill="#000000" opacity="0.18" filter="blur(25px)" />
  <ellipse cx="380" cy="780" rx="200" ry="30" fill="#000000" opacity="0.25" filter="blur(14px)" />

  <!-- 3D ACRYLIC L-STAND PLAQUE ASSEMBLY -->
  <!-- Base Support Foot (extends to bottom-left) -->
  <g filter="url(#baseShadow)">
    <!-- Base Foot Top Face -->
    <polygon points="340,780 230,760 330,695 440,710" fill="#0a0a0a" stroke="#262626" stroke-width="1.5" />
    <!-- Base Foot Left Thickness Edge (Clear Acrylic) -->
    <polygon points="230,760 220,772 328,792 340,780" fill="url(#clearEdge)" />
  </g>

  <!-- Plaque Main Upright Body -->
  <g filter="url(#softShadow)">
    <!-- Clear Transparent Left Acrylic Edge Profile (gives genuine plexiglass realism) -->
    <polygon points="198,105 210,95 400,690 388,705" fill="url(#clearEdge)" stroke="#cbd5e1" stroke-width="0.75" />
    <!-- Clear Top Edge -->
    <polygon points="210,95 635,100 625,108 198,105" fill="#f1f5f9" opacity="0.9" />

    <!-- Main Front Face (Jet Black Acrylic) -->
    <!-- Perspective Quad: Top-Left (205, 102), Top-Right (635, 100), Bottom-Right (742, 630), Bottom-Left (394, 698) -->
    <polygon points="205,102 635,100 742,630 394,698" fill="#050505" stroke="#171717" stroke-width="2" />

    <!-- Diagonal Glossy Specular Light Reflection -->
    <polygon points="205,102 635,100 742,630 394,698" fill="url(#acrylicSheen)" pointer-events="none" />
  </g>

  <!-- GRAPHICS ON THE PLAQUE (Perspective Transformed Group) -->
  <!-- We use a perspective transform matrix to map exactly onto the black face -->
  <g transform="matrix(0.86, 0.05, -0.26, 0.95, 340, 110)">
    <!-- Top Text: "Review Us On" -->
    <text x="75" y="65" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" text-anchor="middle" letter-spacing="0.5">
      Review Us On
    </text>

    <!-- Central Google NFC Ring Target -->
    <g transform="translate(75, 235)">
      <!-- Outer 4-color segmented circle -->
      <!-- Google Blue Arc (top-left) -->
      <path d="M 0 -130 A 130 130 0 0 0 -130 0" fill="none" stroke="#4285F4" stroke-width="12" stroke-linecap="round" />
      <!-- Google Green Arc (bottom-left) -->
      <path d="M -130 0 A 130 130 0 0 0 0 130" fill="none" stroke="#34A853" stroke-width="12" stroke-linecap="round" />
      <!-- Google Yellow Arc (bottom-right) -->
      <path d="M 0 130 A 130 130 0 0 0 130 0" fill="none" stroke="#FBBC05" stroke-width="12" stroke-linecap="round" />
      <!-- Google Red Arc (top-right) -->
      <path d="M 130 0 A 130 130 0 0 0 0 -130" fill="none" stroke="#EA4335" stroke-width="12" stroke-linecap="round" />

      <!-- Center Elements -->
      <!-- NFC Hand + Smartphone Icon -->
      <g transform="translate(0, -60)">
        <!-- NFC text -->
        <text x="18" y="-12" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="900" letter-spacing="1">NFC</text>
        <!-- Radio Waves to the left -->
        <path d="M -18 -8 A 14 14 0 0 0 -18 16" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
        <path d="M -10 -2 A 8 8 0 0 0 -10 10" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />

        <!-- Hand holding Smartphone outline -->
        <g transform="translate(14, 10)">
          <!-- Smartphone -->
          <rect x="-14" y="-22" width="28" height="46" rx="5" fill="none" stroke="#ffffff" stroke-width="3.5" />
          <line x1="-5" y1="18" x2="5" y2="18" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
          <!-- Hand fingers holding the phone -->
          <path d="M 14 -5 C 22 -3, 23 12, 14 14" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
          <path d="M 14 6 C 20 8, 20 18, 12 20" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
        </g>
      </g>

      <!-- TAP HERE text -->
      <text x="0" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="900" text-anchor="middle" letter-spacing="2">
        TAP HERE
      </text>

      <!-- Official Google Wordmark -->
      <g transform="translate(0, 75)" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="700" text-anchor="middle">
        <text x="-62" y="0" fill="#4285F4">G</text>
        <text x="-31" y="0" fill="#EA4335">o</text>
        <text x="-3" y="0" fill="#FBBC05">o</text>
        <text x="24" y="0" fill="#4285F4">g</text>
        <text x="47" y="0" fill="#34A853">l</text>
        <text x="64" y="0" fill="#EA4335">e</text>
      </g>
    </g>

    <!-- 5 Solid Golden-Yellow Stars (★★★★★) -->
    <g transform="translate(75, 415)">
      <!-- Star 1 -->
      <path d="M -80 -15 L -74 -3 L -60 -3 L -71 6 L -67 20 L -80 11 L -93 20 L -89 6 L -100 -3 L -86 -3 Z" fill="#FBBC05" />
      <!-- Star 2 -->
      <path d="M -40 -15 L -34 -3 L -20 -3 L -31 6 L -27 20 L -40 11 L -53 20 L -49 6 L -60 -3 L -46 -3 Z" fill="#FBBC05" />
      <!-- Star 3 -->
      <path d="M 0 -15 L 6 -3 L 20 -3 L 9 6 L 13 20 L 0 11 L -13 20 L -9 6 L -20 -3 L -6 -3 Z" fill="#FBBC05" />
      <!-- Star 4 -->
      <path d="M 40 -15 L 46 -3 L 60 -3 L 49 6 L 53 20 L 40 11 L 27 20 L 31 6 L 20 -3 L 34 -3 Z" fill="#FBBC05" />
      <!-- Star 5 -->
      <path d="M 80 -15 L 86 -3 L 100 -3 L 89 6 L 93 20 L 80 11 L 67 20 L 71 6 L 60 -3 L 74 -3 Z" fill="#FBBC05" />
    </g>

    <!-- Bottom Multi-Colored Stripe (Red, Green, Blue, Yellow) -->
    <g transform="translate(75, 465)">
      <rect x="-110" y="0" width="55" height="7" rx="2" fill="#EA4335" />
      <rect x="-55" y="0" width="55" height="7" rx="0" fill="#34A853" />
      <rect x="0" y="0" width="55" height="7" rx="0" fill="#4285F4" />
      <rect x="55" y="0" width="55" height="7" rx="2" fill="#FBBC05" />
    </g>
  </g>

  <!-- ============================================== -->
  <!-- EXACT DIMENSION ARROWS MATCHING USER PHOTO      -->
  <!-- ============================================== -->

  <!-- Left Dimension Arrow: 14cm / 5.51inch -->
  <g stroke="#000000" stroke-width="2.5" fill="#000000">
    <!-- Main arrow stem -->
    <line x1="172" y1="108" x2="368" y2="790" />
    <!-- Top Arrowhead -->
    <polygon points="172,108 170,126 182,122" />
    <!-- Bottom Arrowhead -->
    <polygon points="368,790 358,774 370,772" />
  </g>
  <!-- Text: 14cm / 5.51inch rotated along the slope -->
  <text x="210" y="475" transform="rotate(74, 210, 475)" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="800" fill="#000000" letter-spacing="1">
    14cm / 5.51inch
  </text>

  <!-- Bottom Front Width Arrow: 12cm / 4.72inch -->
  <g stroke="#000000" stroke-width="2.5" fill="#000000">
    <!-- Main arrow stem -->
    <line x1="418" y1="810" x2="756" y2="658" />
    <!-- Left Arrowhead -->
    <polygon points="418,810 435,808 431,798" />
    <!-- Right Arrowhead -->
    <polygon points="756,658 740,662 744,672" />
  </g>
  <!-- Text: 12cm / 4.72inch rotated along bottom slope -->
  <text x="560" y="775" transform="rotate(-24, 560, 775)" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="800" fill="#000000" letter-spacing="1">
    12cm / 4.72inch
  </text>

  <!-- Base Depth Arrow: 5cm / 1.97inch -->
  <g stroke="#000000" stroke-width="2.5" fill="#000000">
    <!-- Main arrow stem -->
    <line x1="210" y1="808" x2="366" y2="910" />
    <!-- Top-left Arrowhead -->
    <polygon points="210,808 226,815 222,824" />
    <!-- Bottom-right Arrowhead -->
    <polygon points="366,910 352,900 356,892" />
  </g>
  <!-- Text: 5cm / 1.97inch rotated along depth slope -->
  <text x="250" y="885" transform="rotate(33, 250, 885)" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="26" font-weight="800" fill="#000000" letter-spacing="0.5">
    5cm / 1.97inch
  </text>
</svg>
